# Placeholder structure only — values are TBD until Stage 1 real-data audit.
# The keys below establish the shape of the training config; do not treat
# any value here as final.

horizons:
  primary: 10  # years
  discretization_method: "quantile_grid"  # TBD exact cutpoints, deferred to Stage 1

splitting:
  method: "patient_level_stratified"
  stratify_on: "joint_primary_secondary_event_status"
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15

landmarking:
  sampling: "one_random_landmark_per_subject_per_epoch"  # training only

evaluation:
  # Landmark for val / test (and the training-split IPCW reference):
  #   first_post_index (default) = each patient's FIRST visit on/after index_date and before death
  #   random = one random valid visit (seeded), e.g. for random / serial-landmark evaluation later
  landmark: first_post_index

# Class-imbalance outcome weighting: dropped (decision 2026-11-11). All three models sum the
# per-outcome survival losses unweighted.

seed: 42  # deterministic seed — fixed from day one, unlike the prior project

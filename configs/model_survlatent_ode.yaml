# SurvLatent ODE hyperparameters — TBD, placeholder structure only.
# Architecture is implemented (src/compass/models/survlatent_ode/); values below are
# reasonable starting points for synthetic-data development, not tuned.

latent_dim: 16           # placeholder
ode_hidden_dim: 32       # placeholder (MLP hidden size for dh/dt = f(h))
cause_head_hidden_dim: 16  # placeholder
learning_rate: 0.001     # placeholder
weight_decay: 0.0        # AdamW decoupled weight decay (0 = identical to the previous plain Adam)
batch_size: 64           # placeholder (smaller than the other two models' default 128 --
                          # ODE solves are more expensive per example than a GRU/attention step)

# ODE solver. dopri5 = adaptive Dormand-Prince (accuracy-adaptive step size); direct
# (non-adjoint) backprop through the solver -- see model.py docstring for why: sequences
# here are short and small, so the adjoint method's memory savings aren't needed, and direct
# autodiff gives exact gradients through the actual solver steps rather than the adjoint's
# separately-solved backward-time ODE.
solver_method: dopri5    # placeholder; 'rk4' (fixed-step) is a faster alternative if needed
rtol: 1.0e-3             # dopri5 relative tolerance (torchdiffeq default 1e-7 was far tighter than needed)
atol: 1.0e-4             # dopri5 absolute tolerance (torchdiffeq default 1e-9)

# Discrete-time comparison interface only (see hazards_at_bins() in model.py) -- the model
# itself is continuous internally. Same yearly-bin scheme as Dynamic-DeepHit/TraCeR for
# comparability. Exact cutpoints deferred to Stage 1.
num_time_bins: 13       # Bins cover all observable follow-up; the evaluation horizon stays 10 yr.
bin_width_years: 1.0    # placeholder

# No ranking_weight / auxiliary_weight -- like TraCeR, SurvLatent ODE's loss is just the sum
# of three independent per-outcome continuous-time NLLs, unweighted. Nothing else.

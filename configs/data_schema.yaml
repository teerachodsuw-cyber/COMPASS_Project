demographics:
  # Source data uses sex_code 1=male, 2=female; mapping to male/female is done in the loader.
  - {name: sex, type: categorical, values: [male, female]}  # confirmed proportions: male 0.4710, female 0.5290
  - {name: smoking_status, type: categorical, values: [0, 1, 2]}  # 0=never, 1=former, 2=current

outcomes:
  - {name: mortality, type: time_to_event, role: primary, note: "All-cause, NHSO registry-linked."}
  - {name: malo, type: time_to_event, role: secondary, note: "Composite, first incident event after index: compensated cirrhosis, decompensated cirrhosis, HCC, liver transplant. No liver-related death."}
  - {name: cvd, type: time_to_event, role: secondary, note: "Composite, first incident event after index: CAD, stroke, HF, PVD. No CV death. Not at risk if any prevalent CVD at baseline (cad/stroke/hf/pvd_prev)."}

censoring:
  administrative_cutoff: "2025-06-30"  # locked 2026-11-10
  structure: semi_competing_risks
  # Semi-competing structure (unchanged): mortality censors MALO and CVD if it occurs first;
  # MALO and CVD do not censor each other.
  rule: "Mortality: censored at the cutoff (2025-06-30). MALO/CVD, each on its own: if its event occurs (after the landmark, on/before the cutoff), follow-up ends at the event; otherwise censored at min(last lab visit, cutoff). A death after the last lab visit is not a competing event. Events after the cutoff are censored at the cutoff."

cohort:
  n_delivered: 12602
  n_analytic: 11665  # after exclusions: prior liver outcome 923, death on index 3, baseline liver cancer 11
  n_broader_t2dm_registry: 18000
  site: single_center
  institution: "Siriraj Hospital, Mahidol University"
  date_range: ["2013-06-01", "2025-06-30"]

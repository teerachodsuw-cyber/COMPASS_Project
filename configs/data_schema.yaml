  - {name: metformin, prevalence: 0.4041}
  - {name: sulfonylureas, prevalence: 0.2688}
  - {name: pioglitazone, prevalence: 0.1103}
  - {name: insulin, prevalence: 0.1043}
  - {name: dpp4, prevalence: 0.1061}
  - {name: glp1, prevalence: 0.0060}
  - {name: sglt2, prevalence: 0.0259}
  - {name: acei, prevalence: 0.1592}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compass"
version = "0.1.0"
description = "Competing-risk Multi-horizon Prognosis Assessment for Steatotic-liver and diabetes Sequelae"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchdiffeq",
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "lifelines",
    "matplotlib",
    "iterative-stratification",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
